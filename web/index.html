<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GameSaveSync</title>
<style>
  :root{
    --bg:#0a0a0f; --panel:#12121a; --panel2:#171722; --line:#23232f;
    --text:#e5e7eb; --muted:#8b919e; --dim:#5b616e;
    --red:#ef4444; --green:#22c55e; --blue:#3b82f6; --yellow:#eab308; --cyan:#22d3ee;
  }
  *{box-sizing:border-box; margin:0; padding:0}
  html,body{background:var(--bg); color:var(--text);
    font-family:"Segoe UI", system-ui, sans-serif; font-size:14px}
  body{padding:28px 32px 60px; max-width:1280px; margin:0 auto}

  header{display:flex; align-items:baseline; gap:14px; margin-bottom:8px}
  h1{font-size:22px; font-weight:600; letter-spacing:.4px}
  h1 b{color:var(--red)}
  .sub{color:var(--dim); font-size:12px}

  .badge{display:inline-flex; align-items:center; gap:6px; padding:3px 10px; border-radius:999px;
    font-size:12px; font-weight:600; margin-left:auto; border:1px solid var(--line)}
  .badge.ok{color:var(--green); border-color:rgba(34,197,94,.35); background:rgba(34,197,94,.08)}
  .badge.warn{color:var(--yellow); border-color:rgba(234,179,8,.35); background:rgba(234,179,8,.08)}

  .toolbar{display:flex; flex-wrap:wrap; gap:8px; align-items:center; padding:10px 0 6px;
    border-bottom:1px solid var(--line); margin-bottom:12px}
  button{background:var(--panel2); color:var(--text); border:1px solid var(--line);
    border-radius:6px; padding:6px 14px; font-size:13px; cursor:pointer; transition:all .15s}
  button:hover{border-color:var(--red); color:#fff}
  button.primary{background:var(--red); border-color:var(--red); color:#fff; font-weight:600}
  button.primary:hover{background:#f87171}
  button:disabled{opacity:.35; cursor:default}
  button.ghost{background:transparent}
  label.chk{display:flex; align-items:center; gap:6px; margin-left:6px; color:var(--muted); font-size:13px; cursor:pointer}
  input[type=checkbox]{accent-color:var(--red); width:15px; height:15px; cursor:pointer}
  select{background:var(--panel2); color:var(--text); border:1px solid var(--line);
    border-radius:6px; padding:5px 10px; font-size:13px; cursor:pointer}
  .spacer{flex:1}

  .setbar{display:flex; flex-wrap:wrap; gap:10px; align-items:center; padding:8px 0 12px;
    border-bottom:1px solid var(--line); margin-bottom:16px; font-size:13px}
  .setbar .lbl{color:var(--muted); font-size:12px; text-transform:uppercase; letter-spacing:.7px}
  #cloudstatus{color:var(--dim); font-size:12px; font-family:Consolas, monospace}
  .cloudbtn{min-width:110px}
  .cloudbtn.cloud{padding:6px 10px; font-size:12px}
  .hint{color:var(--dim); font-size:12px}

  .stats{display:flex; gap:18px; margin-bottom:18px; font-size:12px; color:var(--muted)}
  .stats b{color:var(--text); font-weight:600}

  .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(360px,1fr)); gap:12px}
  .card{background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:12px 14px;
    transition:border-color .15s}
  .card:hover{border-color:#2d2d3d}
  .card.disabled{opacity:.45}
  .card.top{display:flex; align-items:center; gap:10px; margin-bottom:8px}
  .card h3{font-size:15px; font-weight:600; letter-spacing:.2px}
  .cloudtag{color:var(--blue); font-size:11px; font-weight:700; border:1px solid rgba(59,130,246,.35);
    background:rgba(59,130,246,.08); padding:2px 7px; border-radius:999px; margin-left:6px}
  .offtag{color:var(--dim); font-size:11px; font-weight:700; border:1px solid var(--line);
    padding:2px 7px; border-radius:999px; margin-left:6px}
  .sbadge{margin-left:auto; font-size:11px; font-weight:700; padding:2px 9px; border-radius:999px;
    text-transform:uppercase; letter-spacing:.6px; border:1px solid var(--line)}
  .s-synced{color:var(--green); background:rgba(34,197,94,.1); border-color:rgba(34,197,94,.35)}
  .s-pc-newer,.s-pc-only{color:var(--red); background:rgba(239,68,68,.1); border-color:rgba(239,68,68,.4)}
  .s-usb-newer,.s-usb-only{color:var(--cyan); background:rgba(34,211,238,.08); border-color:rgba(34,211,238,.35)}
  .s-none{color:var(--dim)}
  .path{font-size:11px; color:var(--dim); font-family:Consolas, monospace; white-space:nowrap;
    overflow:hidden; text-overflow:ellipsis; margin-bottom:8px}
  .sides{display:flex; gap:10px}
  .side{flex:1; background:var(--panel2); border:1px solid var(--line); border-radius:8px; padding:8px 10px}
  .side .tag{font-size:10px; text-transform:uppercase; letter-spacing:.8px; color:var(--dim); margin-bottom:4px}
  .side.pc .tag{color:var(--red)}
  .side.usb .tag{color:var(--cyan)}
  .side .num{font-size:15px; font-weight:600}
  .side .meta{font-size:11px; color:var(--muted)}
  .card .acts{display:flex; gap:6px; margin-top:10px; justify-content:flex-end}
  .catom{font-size:12px; padding:4px 10px}

  .legend{display:flex; flex-wrap:wrap; gap:14px; margin:18px 0 6px; font-size:11px; color:var(--muted)}
  .legend span::before{content:""; display:inline-block; width:8px; height:8px; border-radius:50%;
    margin-right:5px; background:currentColor}
  .legend .l-synced{color:var(--green)} .legend .l-new{color:var(--red)}
  .legend .l-usb{color:var(--cyan)} .legend .l-old{color:var(--yellow)} .legend .l-none{color:var(--dim)}

  details{margin-top:20px; border:1px solid var(--line); border-radius:10px; background:var(--panel)}
  summary{padding:10px 16px; cursor:pointer; font-size:13px; font-weight:600; color:var(--muted)}
  #log{max-height:260px; overflow:auto; padding:10px 16px; font-family:Consolas, monospace;
    font-size:12px; color:#9aa3b2; border-top:1px solid var(--line); white-space:pre-wrap; word-break:break-word}
  #toast{position:fixed; bottom:22px; right:26px; background:var(--red); color:#fff; font-size:13px;
    font-weight:600; padding:10px 18px; border-radius:8px; opacity:0; transition:opacity .25s;
    pointer-events:none}
  #toast.show{opacity:1}
</style>
</head>
<body>
  <header>
    <h1>Game<b>Save</b>Sync</h1>
    <span class="sub" id="pcinfo">loading...</span>
    <span class="badge" id="usbbadge">USB: ...</span>
  </header>

  <div class="toolbar">
    <button class="primary" id="btnsync">Sync selected</button>
    <button id="btnpush">Push &rarr;</button>
    <button id="btnpull">Pull &larr;</button>
    <label class="chk"><input type="checkbox" id="drycb"> dry run</label>
    <label class="chk" id="chkallwrap"><input type="checkbox" id="chkall" checked> enable all</label>
    <span class="spacer"></span>
    <button class="ghost" id="btnrefresh">Refresh</button>
    <button class="ghost" id="btnstop">Stop server</button>
  </div>

  <div class="setbar">
    <span class="lbl">Main copy:</span>
    <select id="mainside">
      <option value="auto">Auto (newest wins)</option>
      <option value="pc">This PC wins</option>
      <option value="usb">USB wins</option>
    </select>
    <span class="hint">who wins when both sides changed</span>
    <span class="spacer"></span>
    <button class="cloudbtn cloud" id="btncloudpush">&#9729; Push to cloud</button>
    <button class="cloudbtn cloud" id="btncloudpull">&#9729; Pull from cloud</button>
    <span id="cloudstatus">cloud repo: ...</span>
  </div>

  <div class="stats" id="stats"></div>

  <div class="grid" id="grid"></div>

  <div class="legend">
    <span class="l-synced">in sync</span>
    <span class="l-new">newer on PC</span>
    <span class="l-usb">newer on USB</span>
    <span class="l-old">older copy kept</span>
    <span class="l-none">no saves</span>
  </div>

  <details>
    <summary>Sync log</summary>
    <div id="log"></div>
  </details>

  <div id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const state = { games: [], busy: false, settings: null };

function fmtSize(b){ if(!b) return "0 B"; if(b<1024*1024) return (b/1024).toFixed(0)+" KB";
  return (b/1024/1024).toFixed(1)+" MB"; }
function parseDate(d){ if(!d||d.length<8) return null; const m=parseInt(String(d).match(/\d+/)?.[0]);
  return (!m||m<0) ? null : new Date(m); }
function fmtDate(d){ const t=parseDate(d); if(!t) return "never";
  const p=n=>String(n).padStart(2,"0");
  return t.getFullYear()+"-"+p(t.getMonth()+1)+"-"+p(t.getDate())+" "+p(t.getHours())+":"+p(t.getMinutes()); }
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show");
  clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("show"),2200); }

async function api(path, opts){
  const r = await fetch(path, opts);
  let j = null;
  try{ j = await r.json(); }catch(e){}
  if(!r.ok) throw new Error((j && j.Error) || ("HTTP "+r.status));
  return j;
}

async function loadSettings(){
  try{
    const s = await api("/api/settings");
    state.settings = s;
    $("#mainside").value = s.MainSide;
    $("#cloudstatus").textContent = "cloud repo: " + s.CloudRepoResolved;
  }catch(e){}
}

function enabledFlags(){
  const out = {};
  for(const g of state.games){
    const el = $("#card-" + cssName(g.Name));
    out[g.Name] = { enabled: !!el && el.querySelector(".sel").checked, cloud: g.Cloud };
  }
  return out;
}

function cssName(s){ return s.replace(/[^a-z0-9]+/gi, "_"); }

async function saveSettings(extra){
  const body = Object.assign({ games: enabledFlags() }, extra);
  try{
    await api("/api/settings", { method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify(body) });
  }catch(e){ toast("settings error: " + e.message); }
}

async function loadStatus(){
  try{
    const s = await api("/api/status");
    $("#pcinfo").textContent = s.PC + "  \u00b7  " + s.Games.length + " games";
    const ub = $("#usbbadge");
    ub.className = "badge ok"; ub.textContent = "USB: " + s.Usb + "  connected";
    state.games = s.Games;
    $("#mainside").value = s.MainSide;
    render();
  }catch(e){
    $("#usbbadge").className = "badge warn";
    $("#usbbadge").textContent = "USB missing!";
    toast("Error: " + e.message);
  }
}

function render(){
  const g = $("#grid"); g.innerHTML = "";
  let pcF=0, usbF=0, pcB=0, usbB=0;
  for(const game of state.games){
    pcF+=game.PcFiles; usbF+=game.UsbFiles; pcB+=game.PcBytes; usbB+=game.UsbBytes;
    const el = document.createElement("div");
    el.id = "card-" + cssName(game.Name);
    el.className = "card" + (game.Enabled ? "" : " disabled");
    const cloudTag = game.Cloud ? '<span class="cloudtag">&#9729;</span>' : "";
    const offTag = game.Enabled ? "" : '<span class="offtag">off</span>';
    el.innerHTML =
      '<div class="top">' +
        '<input type="checkbox" class="sel"' + (game.Enabled ? " checked" : "") + '>' +
        '<h3>' + esc(game.Name) + '</h3>' + cloudTag + offTag +
        '<span class="sbadge s-' + game.State + '">' + game.State + '</span>' +
      '</div>' +
      '<div class="path">' + esc(game.PcExists ? game.PcSource : "not on this PC yet") + '</div>' +
      '<div class="sides">' +
        '<div class="side pc"><div class="tag">PC</div><div class="num">' + game.PcFiles + ' files</div>' +
          '<div class="meta">' + fmtSize(game.PcBytes) + " \u00b7 newest " + fmtDate(game.PcNewest) + '</div></div>' +
        '<div class="side usb"><div class="tag">USB</div><div class="num">' + game.UsbFiles + ' files</div>' +
          '<div class="meta">' + fmtSize(game.UsbBytes) + " \u00b7 newest " + fmtDate(game.UsbNewest) + '</div></div>' +
      '</div>' +
      '<div class="acts">' +
        '<button class="catom" data-act="push" data-name="' + esc(game.Name) + '">Push &rarr;</button>' +
        '<button class="catom" data-act="pull" data-name="' + esc(game.Name) + '">Pull &larr;</button>' +
      '</div>';
    g.appendChild(el);
  }
  $("#stats").innerHTML =
    "<span><b>" + pcF + "</b> files / <b>" + fmtSize(pcB) + "</b> on PC</span>" +
    "<span><b>" + usbF + "</b> files / <b>" + fmtSize(usbB) + "</b> on USB</span>";
}

function esc(s){ return String(s).replace(/[&<>"']/g, function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }

function selected(){
  return [...document.querySelectorAll(".card .sel:checked")]
    .map(c => c.closest(".card").querySelector("h3").textContent);
}

async function doSync(names, mode){
  if(state.busy) return;
  if(!names.length){ toast("Select at least one game (checkbox = enabled)"); return; }
  state.busy = true;
  const dry = $("#drycb").checked;
  const btn = mode==="merge" ? $("#btnsync") : (mode==="push" ? $("#btnpush") : $("#btnpull"));
  btn.disabled = true;
  try{
    const r = await api("/api/sync", { method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ games: names, mode: mode, dryRun: dry }) });
    toast((dry ? "DRY: " : "") + r.Done + " game(s) " + mode + " done");
    await Promise.all([loadStatus(), loadLogs()]);
  }catch(e){ toast("Error: " + e.message); }
  finally{ state.busy = false; btn.disabled = false; }
}

async function doCloud(action){
  if(state.busy) return;
  const games = selected();
  const dry = $("#drycb").checked;
  state.busy = true;
  const btn = action==="push" ? $("#btncloudpush") : $("#btncloudpull");
  btn.disabled = true;
  try{
    const r = await api("/api/cloud", { method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ action: action, games: games }) });
    toast("cloud " + action + ": " + r.Done + " game(s)");
    await Promise.all([loadLogs(), loadStatus()]);
  }catch(e){ toast("Error: " + e.message); }
  finally{ state.busy = false; btn.disabled = false; }
}

async function loadLogs(){
  try{
    const r = await api("/api/logs?n=200");
    $("#log").textContent = r.Logs.join("\n");
  }catch(e){}
}

function bindToolbar(){
  $("#btnsync").onclick = () => doSync(selected(), "merge");
  $("#btnpush").onclick = () => doSync(selected(), "push");
  $("#btnpull").onclick = () => doSync(selected(), "pull");
  $("#btncloudpush").onclick = () => doCloud("push");
  $("#btncloudpull").onclick = () => doCloud("pull");
  $("#btnrefresh").onclick = () => { loadStatus(); loadLogs(); loadSettings(); };
  $("#btnstop").onclick = async () => {
    try{ await api("/api/shutdown", { method:"POST" }); }catch(e){}
    toast("Server stopped - close this tab");
  };
  $("#chkall").onchange = e => {
    document.querySelectorAll(".card .sel").forEach(c => c.checked = e.target.checked);
    saveSettings();
    loadStatus();
  };
  $("#mainside").onchange = e => {
    saveSettings({ MainSide: e.target.value });
    toast("Main copy: " + e.target.value);
  };
  $("#grid").addEventListener("click", e => {
    const b = e.target.closest("button[data-act]");
    if(!b) return;
    doSync([b.dataset.name], b.dataset.act);
  });
  $("#grid").addEventListener("change", e => {
    if(e.target.classList.contains("sel")){
      const card = e.target.closest(".card");
      card.classList.toggle("disabled", !e.target.checked);
      saveSettings();
    }
  });
}

bindToolbar();
loadStatus(); loadLogs(); loadSettings();
setInterval(() => { loadStatus(); loadLogs(); }, 8000);
</script>
</body>
</html>
